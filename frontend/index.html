<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Safety Architect Verify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-msg {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Automotive HUD Accents */
        .hud-border {
            border-left: 2px solid #3b82f6;
        }

        .hud-border-user {
            border-right: 2px solid #10b981;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-6 bg-[#020617]">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-tight text-white">FuSa<span class="text-blue-500">Sim</span> <span
                    class="text-xs text-gray-400 font-normal">Automotive Intelligence</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="toggleVoice()" id="voice-toggle"
                class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-gray-700 hover:border-blue-500 transition-all text-xs font-semibold text-gray-400">
                <span id="voice-icon">🔇</span> Voice Off
            </button>
            <div class="text-xs text-gray-500">ISO 26262 | ISO 21448 | ISO 21434</div>
        </div>
    </header>

    <!-- Config Modal (Overlay) -->
    <div id="config-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg p-8 rounded-2xl shadow-2xl relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl"></div>

            <h2 class="text-2xl font-bold text-white mb-6 relative z-10">Configure Audit Session</h2>

            <div class="space-y-4 relative z-10">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Target Role</label>
                    <select id="setup-role"
                        class="w-full bg-gray-800 border-none rounded p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Functional Safety Engineer">Functional Safety Engineer</option>
                        <option value="Safety Manager">Safety Manager</option>
                        <option value="System Architect">System Architect</option>
                        <option value="Software Safety Engineer">Software Safety Engineer</option>
                        <option value="Hardware Safety Engineer">Hardware Safety Engineer</option>
                        <option value="Cybersecurity Engineer">Cybersecurity Engineer</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Standard / Domain</label>
                    <select id="setup-focus"
                        class="w-full bg-gray-800 border-none rounded p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="ISO 26262 (Functional Safety)">ISO 26262 (Functional Safety)</option>
                        <option value="ISO 21448 (SOTIF)">ISO 21448 (SOTIF)</option>
                        <option value="ISO 21434 (Cybersecurity)">ISO 21434 (Cybersecurity)</option>
                        <option value="STPA (System Safety)">STPA (System Safety)</option>
                        <option value="V&V (Testing Strategy)">V&V (Testing Strategy)</option>
                    </select>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Level</label>
                        <select id="setup-level"
                            class="w-full bg-gray-800 border-none rounded p-3 text-white outline-none">
                            <option value="L3">L3 (Junior)</option>
                            <option value="L4" selected>L4 (Senior)</option>
                            <option value="L5">L5 (Architect)</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Exp (Yrs)</label>
                        <input type="number" id="setup-exp" value="5"
                            class="w-full bg-gray-800 border-none rounded p-3 text-white outline-none">
                    </div>
                </div>

                <button onclick="startSession()"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-blue-500/20 mt-4">
                    INITIATE SIMULATION
                </button>
            </div>
        </div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        <!-- Chat Area -->
        <div class="flex-1 flex flex-col relative">
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 pb-24 scroll-smooth">
                <!-- Messages Injected Here -->
            </div>

            <!-- Input Area -->
            <div
                class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0f172a] via-[#0f172a] to-transparent">
                <div class="glass rounded-xl p-2 flex items-center gap-2">
                    <input type="text" id="user-input"
                        class="flex-1 bg-transparent border-none text-white px-4 py-2 focus:outline-none placeholder-gray-600"
                        placeholder="Type answer or click 'Show Answer'..." autocomplete="off">

                    <button onclick="sendShowAnswer()"
                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold transition-colors whitespace-nowrap hidden md:block"
                        title="Reveal Golden Answer">
                        🔍 SHOW ANSWER
                    </button>

                    <button onclick="sendHint()"
                        class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-semibold transition-colors whitespace-nowrap"
                        title="Get a Hint">
                        💡 HINT
                    </button>

                    <button onclick="sendNextQuestion()"
                        class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-semibold transition-colors whitespace-nowrap"
                        title="Get Next Question">
                        ⏩ NEXT
                    </button>

                    <button onclick="sendMessage()"
                        class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold transition-colors">
                        SEND
                    </button>
                    <button onclick="terminateSession()"
                        class="bg-red-900/50 hover:bg-red-800/80 text-red-200 px-3 py-2 rounded-lg text-sm transition-colors border border-red-900">
                        END
                    </button>
                </div>
                <div class="text-center mt-2 text-xs text-gray-600">
                    Pro Tip: Click <strong>Next</strong> to proceed or <strong>Show Answer</strong> if you are stuck.
                </div>
            </div>
        </div>
    </main>

    <!-- Evaluation Modal -->
    <div id="eval-modal" class="fixed inset-0 bg-black/95 z-50 hidden overflow-y-auto p-8">
        <div class="max-w-4xl mx-auto space-y-8">
            <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                Audit Report</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Scorecard -->
                <div class="glass p-6 rounded-xl">
                    <h3 class="text-lg font-semibold text-white mb-4 border-b border-gray-700 pb-2">Competency Matrix
                    </h3>
                    <div id="scorecard-container" class="space-y-3">
                        <!-- Injected -->
                    </div>
                </div>

                <!-- Feedback -->
                <div class="glass p-6 rounded-xl space-y-4">
                    <div>
                        <div class="text-xs text-gray-500 uppercase tracking-wider">Verdict</div>
                        <div id="verdict" class="text-2xl font-bold text-white">Pending</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 uppercase tracking-wider">Detailed Findings</div>
                        <p id="feedback-text" class="text-gray-300 text-sm leading-relaxed mt-1"></p>
                    </div>
                </div>
            </div>

            <div class="glass p-6 rounded-xl border border-blue-500/20">
                <h3 class="font-semibold text-blue-400 mb-2">Improvement Roadmap</h3>
                <p id="roadmap-text" class="text-sm text-gray-300"></p>
            </div>

            <button onclick="location.reload()"
                class="bg-gray-800 hover:bg-gray-700 text-white px-8 py-3 rounded-lg w-full">Start New Session</button>
        </div>
    </div>

    <!-- Client Logic -->
    <script>
        const API_BASE = window.location.origin; // Dynamically grab host
        let sessionId = null;
        const inputField = document.getElementById('user-input');
        const msgsDiv = document.getElementById('messages');

        let isProcessing = false;

        // Allow Enter key: Empty input = Next Question, Non-empty = Send Answer
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isProcessing) {
                if (inputField.value.trim() === '') {
                    sendNextQuestion();
                } else {
                    sendMessage();
                }
            }
        });

        let lastSetupData = null;
        let isVoiceEnabled = false;
        const synth = window.speechSynthesis;

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            const btn = document.getElementById('voice-toggle');
            const icon = document.getElementById('voice-icon');

            if (isVoiceEnabled) {
                btn.classList.add('text-blue-400', 'border-blue-500/50', 'bg-blue-500/10');
                btn.classList.remove('text-gray-400');
                icon.innerText = '🔊';
                btn.innerHTML = `<span id="voice-icon">🔊</span> Voice On`;
                // Initial greeting to prime the engine
                speak("Voice Guidance Active.");
            } else {
                btn.classList.remove('text-blue-400', 'border-blue-500/50', 'bg-blue-500/10');
                btn.classList.add('text-gray-400');
                icon.innerText = '🔇';
                btn.innerHTML = `<span id="voice-icon">🔇</span> Voice Off`;
                synth.cancel();
            }
        }

        function speak(text) {
            if (!isVoiceEnabled || !text) return;

            // Clean markdown for speech
            const cleanText = text
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/### (.*?)\n/g, '$1. ')
                .replace(/\n/g, '. ');

            const utterance = new SpeechSynthesisUtterance(cleanText);

            // Try to find a professional sounding voice
            const voices = synth.getVoices();
            const preferred = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Samantha'));
            if (preferred) utterance.voice = preferred;

            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            synth.cancel(); // Stop current speech
            synth.speak(utterance);
        }

        async function startSession(isRecovery = false) {
            const role = document.getElementById('setup-role').value;
            const focus = document.getElementById('setup-focus').value;
            const level = document.getElementById('setup-level').value;
            const exp = document.getElementById('setup-exp').value;

            document.getElementById('config-modal').style.display = 'none';
            lastSetupData = { target_role: role, topic_focus: focus, target_level: level, experience_years: parseInt(exp) };

            try {
                const res = await fetch(`${API_BASE}/session/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lastSetupData)
                });
                const data = await res.json();
                sessionId = data.session_id;

                // If this is a recovery, the start message IS the next question.
                // We add it to the UI.
                if (isRecovery) {
                    addMessage('interviewer', data.interviewer_message);
                } else {
                    // Normal start
                    addMessage('interviewer', data.interviewer_message);
                }
            } catch (e) {
                alert("Connection Error. Ensure Backend is running.");
                location.reload();
            }
        }

        async function sendMessage(overrideText = null, isRetry = false) {
            const text = overrideText || inputField.value.trim();
            if (!text || !sessionId || (isProcessing && !isRetry)) return;

            isProcessing = true;
            if (!isRetry) {
                if (!overrideText) {
                    inputField.value = '';
                    addMessage('candidate', text);
                } else {
                    const label = text.toLowerCase().includes("answer") ? "🔍 Show Answer" : (text.toLowerCase().includes("hint") ? "💡 Hint" : "⏩ Next Question");
                    addMessage('candidate', label);
                }
            }

            try {
                const res = await fetch(`${API_BASE}/session/${sessionId}/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ candidate_message: text })
                });

                if (res.status === 404 && lastSetupData) {
                    console.log("Session lost. Recovering...");
                    await startSession(true);

                    // If the original command was "Next", stop here because startSession 
                    // already grabbed and displayed the "Next" question.
                    if (text.toLowerCase().includes("next") || text.toLowerCase().includes("start")) {
                        isProcessing = false;
                        return;
                    }

                    // Otherwise, retry the specific command (e.g. Show Answer)
                    return sendMessage(text, true);
                }

                const data = await res.json();
                addMessage('interviewer', data.interviewer_message);
            } catch (e) {
                addMessage('interviewer', "Connection Error. Check your uplink.");
            } finally {
                isProcessing = false;
            }
        }

        function sendHint() {
            sendMessage("Give me a hint");
        }

        function sendShowAnswer() {
            sendMessage("Show Answer");
        }

        function sendNextQuestion() {
            sendMessage("Next Question");
        }

        async function terminateSession() {
            if (!confirm("End Audit?")) return;

            try {
                const res = await fetch(`${API_BASE}/session/${sessionId}/evaluate`, { method: 'POST' });
                const data = await res.json();
                showReport(data);
            } catch (e) {
                console.error(e);
            }
        }

        function addMessage(role, text) {
            if (!text) {
                console.error("Attempted to add empty message for role:", role);
                return;
            }
            const div = document.createElement('div');
            div.className = `chat-msg flex w-full ${role === 'candidate' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] p-4 rounded-2xl text-sm leading-relaxed shadow-md ${role === 'candidate'
                ? 'bg-blue-600 text-white rounded-tr-none hud-border-user'
                : 'bg-slate-800 text-gray-200 rounded-tl-none hud-border'
                }`;

            // Render Markdown-ish (Simple bold/newline)
            bubble.innerHTML = String(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/### (.*?)\n/g, '<h3 class="text-blue-400 font-bold mb-2">$1</h3>')
                .replace(/\n/g, '<br>');

            div.appendChild(bubble);
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;

            if (role === 'interviewer') {
                speak(text);
            }
        }

        function showReport(data) {
            document.getElementById('eval-modal').style.display = 'block';

            // Scorecard
            const sc = document.getElementById('scorecard-container');
            sc.innerHTML = '';
            for (const [k, v] of Object.entries(data.scorecard)) {
                sc.innerHTML += `
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-400">${k}</span>
                        <div class="flex gap-1">
                            ${[1, 2, 3, 4, 5].map(i =>
                    `<div class="w-8 h-2 rounded-full ${i <= v ? 'bg-blue-500' : 'bg-gray-700'}"></div>`
                ).join('')}
                        </div>
                    </div>`;
            }

            document.getElementById('verdict').innerText = data.hiring_recommendation;
            document.getElementById('feedback-text').innerText = data.detailed_feedback;
            document.getElementById('roadmap-text').innerText = data.improvement_plan;
        }
    </script>
</body>

</html>
